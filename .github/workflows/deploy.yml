# Builds src/ into dist/ (tools/build.py), runs the checks, and publishes dist/ to GitHub Pages
# on every push to main. tests/smoke.js is the browser gate (Chromium); the full cross-engine
# check with screenshots (tests/verify.js) stays local.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tests/tokens.py
      - run: python3 tools/build.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node tests/smoke.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
